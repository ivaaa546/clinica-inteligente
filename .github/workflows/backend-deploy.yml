
name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'

permissions:
  contents: read

concurrency:
  group: backend-deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verificar configuración de Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_HEALTHCHECK_URL: ${{ vars.RENDER_HEALTHCHECK_URL }}
        run: |
          faltan=0
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Falta el SECRET RENDER_DEPLOY_HOOK (pestaña Secrets)"
            faltan=1
          fi
          if [ -z "$RENDER_HEALTHCHECK_URL" ]; then
            echo "::error::Falta la VARIABLE RENDER_HEALTHCHECK_URL (pestaña Variables)"
            faltan=1
          fi
          exit $faltan

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

      - name: Wait for API health check
        env:
          RENDER_HEALTHCHECK_URL: ${{ vars.RENDER_HEALTHCHECK_URL }}
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$RENDER_HEALTHCHECK_URL"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
