name: Backend Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-deploy.yml'

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
      - name: Wait for API health check
        env:
          RENDER_HEALTHCHECK_URL: ${{ vars.RENDER_HEALTHCHECK_URL }}
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$RENDER_HEALTHCHECK_URL"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
